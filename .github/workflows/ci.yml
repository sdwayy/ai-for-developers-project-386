name: ci

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Do not let setup-node auto-detect/cache Yarn: it would run the
          # runner's global Yarn 1 before corepack is enabled.
          package-manager-cache: false

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn lint

      - run: yarn test

      - run: yarn build
