on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Personal access token (PAT) stored in the repository secret
          # `RELEASE_PLEASE_TOKEN`. A PAT is required so the release PR can
          # trigger other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Node strategy: bumps the version in package.json and updates
          # CHANGELOG.md. The `simple` strategy would instead expect a
          # version.txt file.
          release-type: node